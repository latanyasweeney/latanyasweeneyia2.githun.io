        <link rel="stylesheet" href="style.css">

    <body>

    <header>
        <h1>SnackVerse</h1>
        <nav>
            <a href="index.html">About Us</a>
            <a href="register.html">Registration</a>
            <a href="login.html">Login</a>

            <a href="Cart.html" class="active">Cart</a>

    <main class="checkout-container">
        <h2>Shopping Cart</h2>
        <!-- Displays whats in cart -->
        <div id="summaryBox" class="summary-box"></div>
        
        <div class="total-amount">
            <h3>Order Summary</h3>

            <div class="totals-section">
                <span>Discount: </span>
                <span>-$<span id="discount">0.00</span></span>
            </div>

            <div class="totals-section">
                <span>Tax (15%): </span>
                <span>$<span id="tax">0.00</span>   
            </div>

            <div class="totals-section">
                <span><strong>Grand Total:</strong></Grand></span>
                <span><strong>$<span id="grandTotal">0.00</span></strong></span>
            </div>
        </div>

        <div class="checkout-buttons">
            <button type="button" onclick="window.location.href='checkout.html'">Proceed to Checkout</button>
            <button type="button" onclick="clearCart()">Clear Cart</button>
            <button type="button" onclick="window.location.href='Products.html'">Continue Shopping</button>
        </div>
        
        </form>
    </main>
