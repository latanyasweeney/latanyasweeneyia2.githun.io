<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnackVerse | Checkout</title>
    <link rel="stylesheet" href="style.css">
    <!-- I didn't want to change the style sheet-Styles for quantity controls and remove button -->
    <style>
        .item-details {
            flex: 1;
        }
         /*Quantity controls styling */
        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
        }
        
        .quantity-controls button {
            width: 32px;
            height: 32px;
            border: 1px solid #ddd;
            background: #f5f5f5;
            cursor: pointer;
            border-radius: 4px;
            font-size: 18px;
            font-weight: bold;
            transition: background 0.2s;
        }
        
        .quantity-controls button:hover {
            background: #e0e0e0;
        }
        
        .quantity-controls span {
            min-width: 60px;
            text-align: center;
            font-weight: 500;
        }
        
        /* NEW: Remove button styling */
        .remove-btn {
            padding: 8px 16px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            height: fit-content;
            transition: background 0.2s;
        }
        
        .remove-btn:hover {
            background: #c82333;
        }
    </style>
</head>
<body>

<header>
    <h1>SnackVerse</h1>
    <nav>
        
        <a href="index.html" class="active">About Us</a>
        <a href="register.html">Registration</a>
        <a href="login.html">Login</a>
        <a href="Products.html">Products</a>
        <a href="Cart.html" class="active">Cart</a>
    </nav>
</header>

<main class="checkout-container">
    <h2>Shopping Cart</h2>
    <!-- Displays whats in cart -->
    <div id="summaryBox" class="summary-box"></div>
    
    <div class="total-amount">
        <h3>Order Summary</h3>

        <div class="totals-section">
            <span>Discount: </span>
            <span>-$<span id="discount">0.00</span></span>
        </div>

        <div class="totals-section">
            <span>Tax (15%): </span>
            <span>$<span id="tax">0.00</span>   
        </div>

        <div class="totals-section">
            <span><strong>Grand Total:</strong></Grand></span>
            <span><strong>$<span id="grandTotal">0.00</span></strong></span>
        </div>
    </div>

           <div class="checkout-buttons">
        <button type="button" onclick="window.location.href='checkout.html'">Proceed to Checkout</button>
        <button type="button" onclick="clearCart()">Clear Cart</button>
        <button type="button" onclick="window.location.href='Products.html'">Continue Shopping</button>
    </div>
    </form>
</main>

<footer>
    <p>&copy; 2025 SnackVerse. All Rights Reserved.</p>
</footer>

<script src="cart.js"></script>
</body>
</html>
